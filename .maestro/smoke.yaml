# Section 9: the one iOS smoke flow.
#
# Open level 1, reveal the solution, watch the live suite turn green, then
# restart the app and confirm progress survived.
#
#   maestro test .maestro/smoke.yaml
#
# Needs a simulator with the app installed:
#   npx expo run:ios --configuration Release
appId: io.plotflow.automatalab
---
- launchApp:
    clearState: true

- assertVisible: 'Automata Lab'
- assertVisible: 'Draw a machine. Watch it run. Read it as a tuple.'
- assertVisible: '0 of 12 solved'

# Levels unlock in order, so only the first one is open.
- assertVisible:
    id: 'level-dfa-ends-in-1'

- tapOn:
    id: 'level-dfa-ends-in-1'
- assertVisible:
    id: 'canvas-card'
- assertVisible: 'Last symbol'

# The transition function is permanent, not behind a toggle. Nothing is drawn
# yet, so the ledger is empty and the suite withholds a verdict.
- assertVisible: 'δ : Q × Σ → Q'
- assertVisible: 'NOTHING DRAWN'

# The toolbar is the same six controls throughout, and Run is not one of them:
# grading is continuous.
- assertVisible: 'Add State'
- assertVisible: 'Connect'
- assertVisible: 'Tidy'
- assertVisible: 'Notes'
- assertNotVisible: 'Run tests'

# Reveal the worked solution, which marks the solve as shown.
- tapOn:
    id: 'notes'
- assertVisible:
    id: 'level-sheet'
- tapOn:
    id: 'tab-hint'
- tapOn:
    id: 'reveal-solution'

# The revealed machine is the verified two state solution, and the ledger
# filled in with it.
- assertVisible: 'q0'
- assertVisible: 'q1'
- assertVisible: 'δ(q0, 1) = q1'
- assertVisible: '4 OF 4 DEFINED'

# The suite graded itself without being asked.
- assertVisible: 'ALL PASSING'
- assertVisible: 'Solved with 2 states, par 2, shown'

# Tapping a test plays its trace between the panes.
- tapOn:
    id: 'test-0101'
- assertVisible:
    id: 'trace-band'
- assertVisible: 'ACCEPTED'
- tapOn: 'Close'

# Progress survives an app restart, not just a screen change.
- stopApp
- launchApp
- assertVisible: '1 of 12 solved'
- assertVisible: 'SHOWN'
